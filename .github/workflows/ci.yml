name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpng-dev glslang-tools shellcheck
      - name: Test compilers and installer
        run: make test
      - name: Test shader-only build
        run: make BUILD_DIR=build/gl-only CAPABILITIES=gl test
      - name: Check release metadata
        run: |
          python3 scripts/release.py check
          if [[ "$HEAD_BRANCH" == release/v* ]]; then
            python3 scripts/release.py verify "${HEAD_BRANCH#release/v}"
          fi
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Check installer shell script
        run: shellcheck install.sh
      - name: Validate example shaders
        run: make test-shaders
      - name: Install Tree-sitter CLI
        run: |
          curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.9/tree-sitter-linux-x64.gz -o "$RUNNER_TEMP/tree-sitter.gz"
          gzip -d "$RUNNER_TEMP/tree-sitter.gz"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test grammar
        run: make tree-sitter-test tree-sitter-parser
